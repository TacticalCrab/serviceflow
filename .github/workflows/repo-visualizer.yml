name: Update repository diagram

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  visualize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate repository diagram
        uses: githubocto/repo-visualizer@0.9.1
        with:
          output_file: images/repository-diagram.svg
          excluded_paths: node_modules,dist,build,target,src-tauri/icons,.git,.vscode,package-lock.json
          max_depth: 5
          commit_message: "docs: update repository diagram [skip ci]"
